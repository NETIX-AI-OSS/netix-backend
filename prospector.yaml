# Self-hosting the packaged profile this repo ships: if the lib's own gate passes through
# `inherits: [netix]`, the mechanism is proven in CI rather than in a scratch venv.
inherits:
  - netix

# Local, never shared: setting this strips prospector's default test-exclusion
# ignore-patterns, which would start linting every adopter's test suite.
test-warnings: true

ignore-paths:
  - .venv
  - docs
