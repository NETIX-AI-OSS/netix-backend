name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: build-only
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: uv sync --locked --all-groups --all-extras
      - name: Assert tag matches project version
        run: |
          v="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "v${v}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != project version v${v}"; exit 1; }
      - name: Assert changelog entry exists
        run: grep -q "${GITHUB_REF_NAME}" CHANGELOG.md
      - run: uv run pytest -q
      - run: uv build
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
