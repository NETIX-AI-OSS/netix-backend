name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: uv sync --locked --all-groups --all-extras
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy netix_backend --config-file pyproject.toml
      - run: uv run prospector --without-tool pylint --max-line-length 120
      - name: pip-audit
        run: |
          uv export --locked --no-dev --no-emit-project --output-file requirements-audit.txt
          uv run pip-audit --disable-pip --no-deps --requirement requirements-audit.txt
